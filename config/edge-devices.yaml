policy:
  local_first: true
  free_advisors_only: true
  cloud_may_control_devices: false
  share_precise_location_with_cloud: false
  first_contact: read_only
  dynamic_discovery: true
  new_devices_default: pending_quarantine
  approved_discovery_scope: deeper_local_analysis_only
  bluetooth_distance_method: rssi_estimate_not_guaranteed
  approval_required:
    - pairing
    - firmware_write
    - radio_transmit
    - physical_actuation
    - location_sharing
devices:
  - id: makey-makey-01
    name: Makey Makey input board
    count: 1
    class: usb_hid_input
    identity_confidence: high
    revision: unverified
    interfaces: [usb-hid]
    capabilities: [keyboard-events, mouse-events, contact-input, conductivity-input]
    proposed_uses: [gate-contact station, water-or-leak contact alarm, large farm task buttons, feeding-check input]
    state: inventory
    safety: [not safety-critical, debounce inputs, isolate from mains, protect outdoor contacts from corrosion]
  - id: kosmoduino-01
    name: Thames & Kosmos CodeGamer KosmoDuino
    count: 1
    class: arduino_ble_controller
    identity_confidence: medium
    revision: unverified
    interfaces: [usb-serial, bluetooth-low-energy-unverified]
    capabilities: [buttons, joystick, leds, arduino-compatible-controller, kit-sensors-unverified]
    proposed_uses: [interactive room station, portable sensor node, farm checklist controller, alert acknowledgement]
    state: inventory
    safety: [enumerate USB and BLE services before pairing, preserve existing firmware before writes]
  - id: elegoo-car-01
    name: ELEGOO Smart Robot Car
