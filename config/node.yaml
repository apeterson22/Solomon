role: node
node_name: ''
bind_host: 0.0.0.0
port: 8765
state_dir: /var/lib/solomonprime
config_dir: /etc/solomonprime
cluster_key_file: /etc/solomonprime/cluster.key
public_api_key_file: /etc/solomonprime/api.key
controller_candidates: []
heartbeat_interval: 15
discovery_interval: 25
stale_after: 90
mdns: true
tailscale_discovery: true
static_peers: []
llm_endpoint: ''
llm_api_key_file: ''
llm_model_hint: ''
llm_advisor: false
auto_rebalance: true
auto_apply_safe_profiles: true
auto_memory: false
memory_backend: sqlite_fts5
memory_vector_enabled: false
memory_consolidation_enabled: false
knowledge_db: /var/lib/solomonprime/knowledge.db
knowledge_vector_backend: feature_hash_v1
knowledge_hybrid_enabled: true
improvement_plan_path: /apps/solomonprime/app/docs/SOLOMONPRIME_TED_IMPROVEMENT_PLAN.md
obsidian_enabled: false
obsidian_vault_path: /var/lib/solomonprime/obsidian
obsidian_sync_mode: manual
workspace_roots:
- /apps/solomonprime
- /data
- /archive
enabled_agents:
- infrastructure
- research-simulation
goals_db: /var/lib/solomonprime/goals.db
experiments_db: /var/lib/solomonprime/experiment-ledger.db
experiment_artifact_dir: /var/lib/solomonprime/experiments
jobs_db: /var/lib/solomonprime/jobs.db
job_workspace_dir: /apps/solomonprime-jobs
job_runner: /usr/local/libexec/solomon-job-broker-client
job_broker_socket: /run/solomonprime/job-broker.sock
job_default_max_runtime: 900
